<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Portfolio de Proyectos — ZigoDev</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Syne:wght@700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/trabajos.css" />
</head>
<body>

  <!-- HEADER -->
  <header class="site-header">
    <nav>
      <a href="index.html" class="logo">ZigoDev</a>
      <ul>
        <li><a href="index.html">Inicio</a></li>
        <li><a href="trabajos.html" class="nav-active">Portfolio</a></li>
        <li><a href="https://wa.me/5491152291994" target="_blank" class="nav-cta">Ponete en Contacto</a></li>
      </ul>
    </nav>
  </header>

  <!-- HERO -->
  <section class="port-hero">
    <div class="port-hero-inner">
      <span class="port-label">Portfolio</span>
      <h1 class="port-heading">Proyectos<br><span class="accent">Realizados.</span></h1>
      <p class="port-sub">Más de 50 proyectos entregados en Argentina y LATAM.</p>
    </div>
  </section>

  <!-- FILTERS -->
  <div class="port-filters">
    <button class="filter-btn active" data-cat="all">Todos <span>19</span></button>
    <button class="filter-btn" data-cat="plataforma">Plataformas Web <span>10</span></button>
    <button class="filter-btn" data-cat="ecommerce">E-commerce <span>3</span></button>
    <button class="filter-btn" data-cat="landing">Landing Pages <span>4</span></button>
    <button class="filter-btn" data-cat="institucional">Institucional <span>2</span></button>
  </div>

  <!-- GRID -->
  <main class="port-grid" id="port-grid"></main>

  <!-- CTA -->
  <section class="port-cta">
    <div class="port-cta-inner">
      <h2>¿Tenés un proyecto en mente?</h2>
      <p>Contactanos para convertir tus ideas en realidad digital.</p>
      <a href="https://wa.me/5491152291994" target="_blank" class="cta-btn">Solicitar presupuesto →</a>
    </div>
  </section>

  <!-- MODAL -->
  <div id="modal" class="modal-overlay" aria-hidden="true">
    <div class="modal-box" role="dialog" aria-modal="true">
      <button class="modal-close" id="modal-close" aria-label="Cerrar">×</button>
      <div class="modal-grid">
        <div class="modal-img-wrap">
          <img id="modal-img" src="" alt="" />
        </div>
        <div class="modal-info">
          <span class="modal-cat" id="modal-cat"></span>
          <h2 class="modal-title" id="modal-title"></h2>
          <div class="modal-meta">
            <span id="modal-client"></span>
            <span id="modal-year"></span>
          </div>
          <p class="modal-desc" id="modal-desc"></p>
          <div class="modal-tech" id="modal-tech"></div>
          <div class="modal-actions">
            <a id="modal-url" href="#" target="_blank" rel="noopener noreferrer" class="modal-visit-btn">
              Visitar sitio
              <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="15" height="15"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/><polyline points="15 3 21 3 21 9"/><line x1="10" y1="14" x2="21" y2="3"/></svg>
            </a>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="js/trabajos.js"></script>
</body>
</html>
